<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phase 제목이 대시보드에 표시되는 경로</title>
<style>
  * { box-sizing: border-box; }
  body { max-width: 38rem; margin: 1.5rem auto; padding: 0 1rem; font: 1rem/1.45 system-ui, sans-serif; color: #18263a; }
  h1 { font-size: 1.55rem; }
  ol { padding: 0; list-style: none; }
  li { padding: .65rem 1rem; background: #edf2f7; border-left: .25rem solid #254b75; }
  li span { display: block; color: #334b62; }
  .edge { padding: .45rem 1.25rem; border: none; background: white; }
  code { font: 1rem ui-monospace, monospace; overflow-wrap: anywhere; }
  @media print { body { margin: 0; } ol { break-inside: avoid; } }
</style>
<main>
  <h1>Phase 제목이 대시보드에 표시되는 경로</h1>
  <p>화살표는 제목 데이터가 전달되는 방향을 표시합니다.</p>
  <ol aria-label="제목 데이터의 흐름">
    <li><code>docs/PHASES.md</code><span>Phase 정의와 제목</span></li>
    <li class="edge">↓ 파일에서 정의 읽기</li>
    <li><code>scripts/dashboard-status.js</code><span>정의에서 ID와 제목 추출</span></li>
    <li class="edge">↓ 상태 목록을 JSON으로 기록</li>
    <li><code>dashboard/status.json</code><span>Phase별 ID, 제목, 증거 상태</span></li>
    <li class="edge">↓ 브라우저가 읽고 화면에 표시</li>
    <li><code>dashboard/index.html</code><span>제목이 있는 항목에 ID와 제목 표시</span></li>
  </ol>
</main>
</html>

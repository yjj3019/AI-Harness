<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="'Segoe UI','Malgun Gothic',sans-serif">
  <defs>
    <style>
      .kicker { font-size: 17px; letter-spacing: 3px; fill: #8A93A3; font-weight: 600; }
      .title  { font-size: 46px; fill: #101418; font-weight: 700; }
      .h2     { font-size: 28px; fill: #101418; font-weight: 700; }
      .item   { font-size: 22px; fill: #46505E; }
      .note   { font-size: 18px; fill: #8A93A3; }
      .mono   { font-family: 'Consolas','Malgun Gothic',monospace; font-size: 16px; fill: #8A93A3; }
      .plattx { font-size: 30px; fill: #FFFFFF; font-weight: 700; }
      .op     { font-size: 22px; fill: #46505E; }
      .opl    { font-size: 18px; fill: #2563EB; font-weight: 700; letter-spacing: 2px; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1600" height="6" fill="#2563EB"/>

  <rect x="80" y="74" width="13" height="13" fill="#2563EB"/>
  <text x="106" y="86" class="kicker">CONCEPT · 03 — 한 플랫폼, 두 워크로드, 한 운영</text>
  <line x1="80" y1="118" x2="1520" y2="118" stroke="#2A3648" stroke-width="1"/>

  <text x="78" y="192" class="title">한 플랫폼, 두 워크로드, 한 운영</text>
  <circle cx="1188" cy="182" r="6" fill="#16A34A"/><text x="1202" y="188" font-size="17" fill="#46505E">확인</text>
  <circle cx="1278" cy="182" r="6" fill="#DC2626"/><text x="1292" y="188" font-size="17" fill="#46505E">미검증</text>
  <circle cx="1398" cy="182" r="6" fill="#D97706"/><text x="1412" y="188" font-size="17" fill="#46505E">제안</text>

  <!-- VM workload box -->
  <rect x="80" y="240" width="660" height="250" fill="#FFFFFF" stroke="#101418" stroke-width="2"/>
  <text x="112" y="296" class="h2">가상 머신 워크로드</text>
  <text x="628" y="296" text-anchor="end" class="mono">F3 미검증</text>
  <circle cx="706" cy="290" r="6" fill="#DC2626"/>
  <text x="112" y="352" class="item">— 기존 VM (레거시)</text>
  <text x="112" y="388" class="item">— 컨테이너화 어려운 앱</text>
  <text x="112" y="452" class="note">하이퍼바이저 기반 가상화 (정의 F2)</text>

  <!-- Container workload box -->
  <rect x="860" y="240" width="660" height="250" fill="#FFFFFF" stroke="#101418" stroke-width="2"/>
  <text x="892" y="296" class="h2">컨테이너 워크로드</text>
  <text x="1408" y="296" text-anchor="end" class="mono">F1 확인</text>
  <circle cx="1486" cy="290" r="6" fill="#16A34A"/>
  <text x="892" y="352" class="item">— 마이크로서비스</text>
  <text x="892" y="388" class="item">— 클라우드 네이티브 앱</text>
  <text x="892" y="452" class="note">→ 함께 마이그레이션 · 실행 · 관리 (확인 F1)</text>

  <!-- arrows -->
  <line x1="410" y1="494" x2="410" y2="560" stroke="#101418" stroke-width="2"/>
  <polygon points="410,572 402,558 418,558" fill="#101418"/>
  <line x1="1190" y1="494" x2="1190" y2="560" stroke="#101418" stroke-width="2"/>
  <polygon points="1190,572 1182,558 1198,558" fill="#101418"/>

  <!-- platform bar -->
  <rect x="80" y="584" width="1440" height="92" fill="#101418"/>
  <text x="800" y="642" text-anchor="middle" class="plattx">한 플랫폼 — VM과 컨테이너의 공존  (확인 F1)</text>

  <!-- common operations band -->
  <rect x="80" y="724" width="1440" height="132" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="112" y="766" class="opl">공통 운영 체계 — 제안 (F5)</text>
  <text x="112" y="822" class="op">동일 정책</text>
  <text x="472" y="822" class="op">검증 게이트</text>
  <text x="832" y="822" class="op">근거표 공유</text>
  <text x="1192" y="822" class="op">미검증 라벨 유지</text>
  <line x1="440" y1="792" x2="440" y2="840" stroke="#D8DDE4" stroke-width="1"/>
  <line x1="800" y1="792" x2="800" y2="840" stroke="#D8DDE4" stroke-width="1"/>
  <line x1="1160" y1="792" x2="1160" y2="840" stroke="#D8DDE4" stroke-width="1"/>

  <line x1="80" y1="908" x2="1520" y2="908" stroke="#D8DDE4" stroke-width="1"/>
  <text x="80" y="944" class="note">개념 개요 (제안 F5) — 발표자료 4번 슬라이드 · 설계 세부 F3 미검증 (403 → 재실측 필요)</text>
  <text x="1520" y="944" text-anchor="end" class="mono">2026-11-11 · 01-facts.md</text>

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: checks / node ${{ matrix.node }}
    # One full run plus one attestation replay at the 150-minute gate limit.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
      - name: Run all checks
        timeout-minutes: 150
        run: bash tests/run-all.sh
      # B1 measurement (not a gate): record what this host allows across read/write/exec/net.
      # Node-22 leg only so the two matrix legs do not collide on the artifact name.
      - name: Measure host permission matrix (ubuntu)
        if: matrix.node == 22
        run: |
          node scripts/host-permission-matrix.js
          node scripts/host-permission-matrix.js --markdown > host-permission-matrix-ubuntu.md
      - name: Upload host permission matrix (ubuntu)
        if: matrix.node == 22
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: host-permission-matrix-ubuntu
          path: host-permission-matrix-ubuntu.md
      # Independent re-verification: every committed attestation is checked against the checked-out
      # code and its test command is run again here, not trusted from the local session.
      # Verify every file, even when multiple attestations name the same tree and test command.
      - name: Verify phase attestations
        run: |
          shopt -s nullglob
          attestations=(docs/attestations/phase-*.json)
          echo "Attestation files found: ${#attestations[@]} (optional discovery, not a required-phase policy)"
          if [ "${#attestations[@]}" -eq 0 ]; then
            echo "No attestations verified; this does not prove any phase is complete."
          fi
          for f in "${attestations[@]}"; do
            id=${f#docs/attestations/phase-}; id=${id%.json}
            node .claude/workflows/phase-gate.js verify-attestation "$id"
          done

  portability:
    name: portability / ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Ensure test dependencies
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            dependencies=()
            command -v jq >/dev/null 2>&1 || dependencies+=(jq)
            command -v sha256sum >/dev/null 2>&1 || dependencies+=(coreutils)
            if [ "${#dependencies[@]}" -gt 0 ]; then brew install "${dependencies[@]}"; fi
            if brew list coreutils >/dev/null 2>&1; then
              echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
            fi
          elif [ "$RUNNER_OS" = "Windows" ]; then
            command -v jq >/dev/null 2>&1 || choco install jq -y --no-progress
          fi
      - name: Run full regression on host
        timeout-minutes: 150
        run: bash tests/run-all.sh
      # B1 measurement (not a gate): one row per host OS, captured as an artifact.
      - name: Measure host permission matrix
        run: |
          node scripts/host-permission-matrix.js
          node scripts/host-permission-matrix.js --markdown > "host-permission-matrix-${{ matrix.os }}.md"
      - name: Upload host permission matrix
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: host-permission-matrix-${{ matrix.os }}
          path: host-permission-matrix-${{ matrix.os }}.md

  isolation-linux:
    name: isolation / linux namespace
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test isolation mount parser fixtures
        run: python3 tests/test-runtime-isolation-fixtures.py
      - name: Validate actual filesystem and network namespace isolation
        run: bash tests/runtime-isolation-linux.sh

  toolbroker-fixtures:
    name: toolbroker / ${{ matrix.os }}
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Deny-default broker, atomic DB and unknown API result regression
        run: python -m unittest discover -s tests/toolbroker -p 'test_*.py' -v

  self-qa:
    name: self-qa / shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Shellcheck the shell test runner
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck >/dev/null
          shellcheck --version | head -1
          shellcheck -x tests/run-all.sh
          bash -n tests/run-all.sh

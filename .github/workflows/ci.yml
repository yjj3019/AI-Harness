name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request cancels the older run; pushes to main are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  attestation-discovery:
    name: attestation discovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      phases: ${{ steps.phases.outputs.phases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: phases
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node scripts/verify-attestation-inventory.js --matrix "$BASE_SHA" >> "$GITHUB_OUTPUT"
      - name: PR base ${{ github.event.pull_request.number }} ${{ github.event.pull_request.base.sha }}
        if: github.event_name == 'pull_request'
        run: "true"
      - name: PR merge ${{ github.sha }}
        if: github.event_name == 'pull_request'
        run: "true"

  attestation-replay:
    name: attestation replay / ${{ matrix.phase }}
    needs: attestation-discovery
    strategy:
      fail-fast: false
      matrix:
        phase: ${{ fromJSON(needs.attestation-discovery.outputs.phases) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      # The attestation signature is optional (owner decision 2026-11-27). A signature that is present is still verified; the base commit is fetched so `--require-signature` can be switched back on by adding it to the command below.
      - name: Fetch the base commit
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"
      - name: Verify phase attestation
        env:
          PHASE_ID: ${{ matrix.phase }}
          ATTEST_KEY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node .claude/workflows/phase-gate.js verify-attestation "$PHASE_ID" --require-pinned-command

  attestation-summary:
    name: attestation summary
    if: always()
    needs: [attestation-discovery, attestation-replay]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every replay to pass
        env:
          DISCOVERY_RESULT: ${{ needs.attestation-discovery.result }}
          REPLAY_RESULT: ${{ needs.attestation-replay.result }}
        run: test "$DISCOVERY_RESULT" = success && test "$REPLAY_RESULT" = success

  checks:
    name: checks / node ${{ matrix.node }}
    needs: attestation-summary
    # always(): when the attestation replay fails this job must report a failure, not be skipped.
    if: ${{ always() }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - name: Require the attestation summary
        env:
          SUMMARY_RESULT: ${{ needs.attestation-summary.result }}
        run: test "$SUMMARY_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
      - name: Run all checks
        timeout-minutes: 150
        run: bash tests/run-all.sh
      # B1 measurement (not a gate): record what this host allows across read/write/exec/net.
      # Node-22 leg only so the two matrix legs do not collide on the artifact name.
      - name: Measure host permission matrix (ubuntu)
        if: matrix.node == 22
        run: |
          node scripts/host-permission-matrix.js
          node scripts/host-permission-matrix.js --markdown > host-permission-matrix-ubuntu.md
      - name: Upload host permission matrix (ubuntu)
        if: matrix.node == 22
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: host-permission-matrix-ubuntu
          path: host-permission-matrix-ubuntu.md
  portability:
    name: portability / ${{ matrix.os }}
    needs: attestation-summary
    if: ${{ always() }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Require the attestation summary
        env:
          SUMMARY_RESULT: ${{ needs.attestation-summary.result }}
        run: test "$SUMMARY_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Ensure test dependencies
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            dependencies=()
            command -v jq >/dev/null 2>&1 || dependencies+=(jq)
            command -v sha256sum >/dev/null 2>&1 || dependencies+=(coreutils)
            if [ "${#dependencies[@]}" -gt 0 ]; then brew install "${dependencies[@]}"; fi
            if brew list coreutils >/dev/null 2>&1; then
              echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
            fi
          elif [ "$RUNNER_OS" = "Windows" ]; then
            command -v jq >/dev/null 2>&1 || choco install jq -y --no-progress
          fi
      - name: Run full regression on host
        timeout-minutes: 150
        run: bash tests/run-all.sh
      # B1 measurement (not a gate): one row per host OS, captured as an artifact.
      - name: Measure host permission matrix
        run: |
          node scripts/host-permission-matrix.js
          node scripts/host-permission-matrix.js --markdown > "host-permission-matrix-${{ matrix.os }}.md"
      - name: Upload host permission matrix
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: host-permission-matrix-${{ matrix.os }}
          path: host-permission-matrix-${{ matrix.os }}.md

  isolation-linux:
    name: isolation / linux namespace
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test isolation mount parser fixtures
        run: python3 tests/test-runtime-isolation-fixtures.py
      - name: Validate actual filesystem and network namespace isolation
        run: bash tests/runtime-isolation-linux.sh

  toolbroker-fixtures:
    name: toolbroker / ${{ matrix.os }}
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Deny-default broker, atomic DB and unknown API result regression
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests/toolbroker -p 'test_*.py' -v 2>&1 | tee toolbroker.log
          # A required check must show that tests ran: discovery of zero cases, or only skipped ones, exits 0.
          ran=$(sed -n 's/^Ran \([0-9][0-9]*\) test.*/\1/p' toolbroker.log | tail -1)
          skipped=$(sed -n 's/^OK (skipped=\([0-9][0-9]*\)[,)].*/\1/p' toolbroker.log | tail -1)
          echo "toolbroker: ran=${ran:-0} skipped=${skipped:-0}"
          test "${ran:-0}" -ge 20
          test $(( ${ran:-0} - ${skipped:-0} )) -ge 20

  self-qa:
    name: self-qa / shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Shellcheck the shell test runner
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck >/dev/null
          shellcheck --version | head -1
          shellcheck -x tests/run-all.sh
          bash -n tests/run-all.sh
          # Hooks are the guardrails the constitution relies on: lint them too (errors only) and check syntax.
          shellcheck -S error -x .claude/hooks/*.sh .codex/hooks/*.sh tests/hooks.test.sh
          for f in .claude/hooks/*.sh .codex/hooks/*.sh; do bash -n "$f"; done

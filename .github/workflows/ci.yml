name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: checks / node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
      - name: Run all checks
        run: bash tests/run-all.sh
      # Independent re-verification: every committed attestation is checked against the checked-out
      # code and its test command is run again here, not trusted from the local session.
      - name: Verify phase attestations
        run: |
          shopt -s nullglob
          for f in docs/attestations/phase-*.json; do
            id=${f#docs/attestations/phase-}; id=${id%.json}
            node .claude/workflows/phase-gate.js verify-attestation "$id"
          done

  portability:
    name: portability / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Ensure test dependencies
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            dependencies=()
            command -v jq >/dev/null 2>&1 || dependencies+=(jq)
            command -v sha256sum >/dev/null 2>&1 || dependencies+=(coreutils)
            if [ "${#dependencies[@]}" -gt 0 ]; then brew install "${dependencies[@]}"; fi
            if brew list coreutils >/dev/null 2>&1; then
              echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
            fi
          elif [ "$RUNNER_OS" = "Windows" ]; then
            command -v jq >/dev/null 2>&1 || choco install jq -y --no-progress
          fi
      - name: Run full regression on host
        run: bash tests/run-all.sh

  isolation-linux:
    name: isolation / linux namespace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Test isolation mount parser fixtures
        run: python3 tests/test-runtime-isolation-fixtures.py
      - name: Validate actual filesystem and network namespace isolation
        run: bash tests/runtime-isolation-linux.sh

  toolbroker-fixtures:
    name: toolbroker / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Deny-default broker, atomic DB and unknown API result regression
        run: python -m unittest discover -s tests/toolbroker -p 'test_*.py' -v

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>AI-Harness Dashboard</title>
  <style>
    :root {
      --bg: #1a1a1a;
      --surface: #242424;
      --text: #e8e6e3;
      --muted: #8a8680;
      --line: #333;
      --ok: #5C8A6B;
      --warn: #B87333;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
    header { padding: 24px 32px; border-bottom: 1px solid var(--line); }
    h1 { margin: 0; font-size: 20px; font-weight: 500; }
    .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
    main { padding: 24px 32px; max-width: 960px; }
    .phase { border: 1px solid var(--line); margin-bottom: 12px; }
    .phase-header { display: flex; justify-content: space-between; padding: 12px 16px; background: var(--surface); }
    .phase-id { font-family: var(--mono); font-size: 13px; }
    .evidence { font-family: var(--mono); font-size: 12px; color: var(--muted); }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
    .dot.ok { background: var(--ok); }
    .dot.warn { background: var(--warn); }
    .dot.empty { background: #444; }
    footer { padding: 16px 32px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); }
  </style>
</head>
<body>
  <header>
    <h1>AI-Harness</h1>
    <div class="sub">Phase evidence overview · PLACEHOLDER (not live attestation data)</div>
  </header>
  <main id="phases">
    <!-- filled by script -->
  </main>
  <footer>PLACEHOLDER ONLY. Open docs/PHASES.md and docs/attestations/ for the source of truth. This page does not read live evidence.</footer>
  <script>
    // PLACEHOLDER DATA. Not connected to docs/attestations/. Do not treat as live status.
    const phases = [
      { id: 'P1', title: 'Setup', evidence: 3, total: 4 },
      { id: 'P2', title: 'Core loop', evidence: 2, total: 4 },
      { id: 'P3', title: 'Skills', evidence: 4, total: 4 },
      { id: 'P4', title: 'Verification', evidence: 1, total: 3 }
    ];
    const root = document.getElementById('phases');
    phases.forEach(p => {
      const div = document.createElement('div');
      div.className = 'phase';
      const dots = Array.from({length: p.total}, (_, i) =>
        `<span class="dot ${i < p.evidence ? 'ok' : 'empty'}"></span>`
      ).join('');
      div.innerHTML = `
        <div class="phase-header">
          <span class="phase-id">${p.id} · ${p.title}</span>
          <span class="evidence">${dots} ${p.evidence}/${p.total}</span>
        </div>
      `;
      root.appendChild(div);
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>AI-Harness Dashboard</title>
  <style>
    :root {
      --bg: #1a1a1a;
      --surface: #242424;
      --text: #e8e6e3;
      --muted: #8a8680;
      --line: #333;
      --ok: #5C8A6B;
      --warn: #B87333;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
    header { padding: 24px 32px; border-bottom: 1px solid var(--line); }
    h1 { margin: 0; font-size: 20px; font-weight: 500; }
    .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
    main { padding: 24px 32px; max-width: 960px; }
    .phase { border: 1px solid var(--line); margin-bottom: 12px; }
    .phase-header { display: flex; justify-content: space-between; padding: 12px 16px; background: var(--surface); }
    .phase-id { font-family: var(--mono); font-size: 13px; }
    .evidence { font-family: var(--mono); font-size: 12px; color: var(--muted); }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
    .dot.ok { background: var(--ok); }
    .dot.warn { background: var(--warn); }
    .dot.empty { background: #444; }
    footer { padding: 16px 32px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--line); }
  </style>
</head>
<body>
  <header>
    <h1>AI-Harness</h1>
    <div class="sub">Phase evidence overview · loads dashboard/status.json when present</div>
  </header>
  <main id="phases">
    <!-- filled by script -->
  </main>
  <footer>Source of truth: docs/PHASES.md and docs/attestations/. This page shows dashboard/status.json if generated.</footer>
  <script>
    const root = document.getElementById('phases');
    function render(phases) {
      root.replaceChildren();
      if (!Array.isArray(phases) || !phases.length) {
        const empty = document.createElement('p');
        empty.textContent = 'No phase status available. Run: node scripts/dashboard-status.js';
        root.appendChild(empty);
        return;
      }
      phases.forEach(p => {
        const div = document.createElement('div');
        div.className = 'phase';
        const header = document.createElement('div');
        header.className = 'phase-header';
        const title = document.createElement('span');
        title.className = 'phase-id';
        title.textContent = p.title ? `${p.id} · ${p.title}` : p.id;
        const status = document.createElement('span');
        status.className = 'evidence';
        status.textContent = {
          missing: 'No attestation',
          invalid: 'Invalid attestation',
          unverified: 'Attestation present · verification pending',
        }[p.attestation] || 'Verification unknown';
        header.append(title, status);
        div.appendChild(header);
        root.appendChild(div);
      });
    }
    fetch('status.json').then(r => r.ok ? r.json() : []).then(render).catch(() => render([]));
  </script>
</body>
</html>

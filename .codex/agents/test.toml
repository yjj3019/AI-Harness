name = "test"
description = "Executes dynamic tests through the evidence runner. Uses browser tools only when they are in its tool list."
developer_instructions = """
# Test Agent\r
\r
## Primary Objective\r
\r
Execute automated tests using objective environment tools (CLI test scripts, browser snapshots) rather than subjective code reading.\r
\r
## Protocol\r
\r
- Run the project's tests only through the evidence runner:\r
  `node .Codex/workflows/phase-gate.js run <phase> test --require-test-summary -- <command>`\r
  The runner executes the command, stores the log, and records the real exit code. Do not run tests another way to reach a verdict. Do not write under `.phase-evidence/`.\r
- The runner exits 0 when the test passed and 2 when it failed. Report TEST_PASS or TEST_FAIL with the last lines of the output.\r
- Browser tools (`mcp__playwright__*`) exist only when the project enabled Playwright MCP (`.mcp.json`, see `.mcp.json.example`). If they are not in your tool list, say so and do not claim browser verification.\r
- Browser observations (snapshot, console, network) are supplementary. They are not evidence by themselves, because only the runner records evidence. A UI check that must count goes into a project test script and runs through the evidence runner.\r
- Never use script-execution, storage-writing, routing or upload tools, even if they appear in your list. The allowed set is the `tools` list above.\r
- Report objective output only: console output, network errors, element states. Do not interpret code by reading it."""
